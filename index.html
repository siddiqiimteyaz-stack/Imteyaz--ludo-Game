<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>हंसी वाला लूडो</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="topbar">
  🎲 IMTEYAZ LUDO 
  <button id="muteBtn" class="muteBtn" title="आवाज़ बंद/चालू करें">🔊</button>
</header>

<!-- Mode चुनने वाली शुरुआती screen -->
<div id="modeScreen" class="modeScreen">
  <h2>कैसे खेलना है?</h2>
  <button id="vsAiBtn" class="modeBtn">🤖 Computer (AI) के खिलाफ़</button>
  <button id="pass4Btn" class="modeBtn">👨‍👩‍👧‍👦 दोस्तों के साथ (एक मोबाइल पर बारी-बारी)</button>
</div>

<!-- कितने खिलाड़ी (सिर्फ़ pass-mode और AI mode दोनों के लिए) -->
<div id="playerCountScreen" class="modeScreen" style="display:none;">
  <h2>कितने खिलाड़ी?</h2>
  <button class="modeBtn playerCountBtn" data-count="2">2 खिलाड़ी</button>
  <button class="modeBtn playerCountBtn" data-count="3">3 खिलाड़ी</button>
  <button class="modeBtn playerCountBtn" data-count="4">4 खिलाड़ी</button>
</div>

<!-- असली खेल वाला हिस्सा -->
<div id="gameScreen" class="gameScreen" style="display:none;">

  <div id="championBanner" class="championBanner" style="display:none;"></div>

  <div id="diceFace" class="diceFace turn-red">
    <div class="dot" style="visibility:hidden;"></div>
  </div>

  <div id="board" class="board"></div>

  <p id="messageText" class="messageText">🎲 पासे पर टैप करें</p>

  <div class="controls">
    <button id="restartBtn" class="restartBtn">🔄 दोबारा शुरू करें</button>
  </div>
</div>

<!-- खेल पूरी तरह ख़त्म होने पर नतीजे -->
<div id="finalScreen" class="finalScreen" style="display:none;">
  <h2>🏁 खेल ख़त्म!</h2>
  <div id="rankingList" class="rankingList"></div>
  <button id="finalRestartBtn" class="restartBtn">🔄 नया खेल शुरू करें</button>
</div>

<script src="game.js"></script>
</body>
</html>
